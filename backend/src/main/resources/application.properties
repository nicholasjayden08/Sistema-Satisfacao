spring.application.name=padapadoca-api
server.port=8081

# Banco H2 salvo em arquivo (fica em ./data na raiz do projeto).
# Facil de trocar por PostgreSQL/MySQL depois, so mudando essas 4 linhas.
spring.datasource.url=jdbc:h2:file:./data/padapadoca
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2, util pra ver as tabelas direto no navegador durante o desenvolvimento
# Acesse em http://localhost:8081/h2-console (JDBC URL: jdbc:h2:file:./data/padapadoca)
spring.h2.console.enabled=true

# Login do painel administrativo (Basic Auth).
# IMPORTANTE: isso aqui e so pra desenvolvimento. Antes de publicar pra padaria
# de verdade, sobrescreva com variaveis de ambiente:
#   PADAPADOCA_ADMIN_USERNAME / PADAPADOCA_ADMIN_PASSWORD
# nunca deixe a senha padrao em producao.
padapadoca.admin.username=${PADAPADOCA_ADMIN_USERNAME:PadaPadocaAdmin}
padapadoca.admin.password=${PADAPADOCA_ADMIN_PASSWORD:123456}
