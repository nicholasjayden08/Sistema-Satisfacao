spring.application.name=padapadoca-api
server.port=8081

# Banco H2 salvo em arquivo (fica em ./data na raiz do projeto).
# Facil de trocar por PostgreSQL/MySQL depois, so mudando essas 4 linhas.
spring.datasource.url=jdbc:h2:file:./data/padapadoca
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2, util pra ver as tabelas direto no navegador durante o desenvolvimento
# Acesse em http://localhost:8080/h2-console (JDBC URL: jdbc:h2:file:./data/padapadoca)
spring.h2.console.enabled=true
